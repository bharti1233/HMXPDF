name: Android staging integration (cloud)

# Cloud-only verification for the staging backend client.
#  - workflow_dispatch only: never runs on pushes, tags or pull requests.
#  - No signing secrets, no release artifacts, no GitHub release.
#  - Debug-equivalent `staging` build type; production variants are untouched.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: JVM unit tests (staging variant)
        run: >
          ./gradlew testPlayStagingUnitTest
          --stacktrace
          -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
          -Pkotlin.daemon.jvmargs=-Xmx4g
      - name: Compile staging debug APK
        run: >
          ./gradlew assemblePlayStaging
          --stacktrace
          -Dorg.gradle.jvmargs="-Xmx4g -Dfile.encoding=UTF-8"
          -Pkotlin.daemon.jvmargs=-Xmx4g
      - name: Upload staging APK (cloud artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: hmx-pdf-staging-apk
          path: app/build/outputs/apk/play/staging/*.apk
          if-no-files-found: error
